name: Supabase keepalive ping

# Каждый день в 06:00 по Баку (UTC+4, без перехода на летнее время)
# записывает текущую дату/время в таблицу keepalive_ping.
# GitHub Actions понимает время только в UTC, поэтому 06:00 Баку = 02:00 UTC.
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}   # позволяет запустить вручную: вкладка Actions → Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, что секреты заданы
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Секрет SUPABASE_URL не задан (или задан пустым)."
            echo "::error::Repo → Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Секрет SUPABASE_SERVICE_ROLE_KEY не задан (или задан пустым)."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::SUPABASE_URL должен начинаться с https:// — сейчас значение: '$SUPABASE_URL'"
              exit 1
              ;;
          esac
          echo "Секреты на месте, URL выглядит корректно."

      - name: Записать текущее время в Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          # На случай, если URL скопирован со слэшем на конце или с пробелом.
          CLEAN_URL=$(echo "$SUPABASE_URL" | xargs)
          CLEAN_URL="${CLEAN_URL%/}"

          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Пингуем $CLEAN_URL, текущее время (UTC): $NOW"

          HTTP_CODE=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST "$CLEAN_URL/rest/v1/keepalive_ping" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\": 1, \"pinged_at\": \"$NOW\"}")

          echo "Ответ Supabase (HTTP $HTTP_CODE):"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Запрос завершился ошибкой (HTTP $HTTP_CODE) — проверьте, что таблица keepalive_ping существует и SUPABASE_SERVICE_ROLE_KEY верный (не anon key)."
            exit 1
          fi
